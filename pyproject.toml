[project]
name = "capt12"
version = "0.1.0"
description = "Reproducible block-transport CAPT research implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "pydantic>=2.6",
  "pyyaml>=6",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "seaborn>=0.13",
  "typer>=0.12",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
capt12 = "capt12.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capt12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
